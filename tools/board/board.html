/* Layout: a review queue. Summary strip, section tabs, then one row per asset: the before|after image, what was fixed, what is left, your call. */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15171c; --panel: #1f232a; --ink: #e8eaee; --muted: #9aa3b2; --line: #333945;
  --accent: #f06595; --accent-ink: #1b1e24;
  --ok: #69db7c; --ok-bg: #1d3323; --warn: #ffc078; --warn-bg: #3a2c17; --bad: #ff8787; --bad-bg: #3d1f22;
  --sheet: #2a2e36; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15171c; --panel: #1f232a; --ink: #e8eaee; --muted: #9aa3b2; --line: #333945;
  --accent: #f06595; --accent-ink: #1b1e24;
  --ok: #69db7c; --ok-bg: #1d3323; --warn: #ffc078; --warn-bg: #3a2c17; --bad: #ff8787; --bad-bg: #3d1f22;
  --sheet: #2a2e36; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px }
header { display: grid; gap: 8px }
h1 { font: 700 2rem/1.1 var(--f-display); margin: 0; letter-spacing: .01em; text-wrap: balance }
h1 span { color: var(--accent) }
.sub { color: var(--muted); margin: 0; max-width: 65ch }
.summary { display: flex; flex-wrap: wrap; gap: 8px }
.chip { font: 600 .8rem/1 var(--f-data); padding: 7px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--muted) }
.chip b { color: var(--ink) }
.chip.ok b { color: var(--ok) } .chip.warn b { color: var(--warn) } .chip.bad b { color: var(--bad) }
nav { display: flex; flex-wrap: wrap; gap: 6px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 8px; z-index: 5 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
nav button { font: 600 .9rem var(--f-body); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; border-radius: 4px; cursor: pointer }
nav button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
nav button .n { font-family: var(--f-data); opacity: .75; margin-left: 4px }
.banner { border: 1px solid var(--line); background: var(--panel); padding: 10px 14px; border-radius: 4px; color: var(--muted); font-size: .9rem }
.list { display: grid; gap: 14px }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); overflow: hidden }
.item[data-status="approve"] { border-left: 4px solid var(--ok) }
.item[data-status="fix"] { border-left: 4px solid var(--warn) }
.item[data-status="redraw"] { border-left: 4px solid var(--bad) }
@media (max-width: 760px) { .item { grid-template-columns: minmax(0, 1fr) } }
.pics { background: var(--sheet); padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0 }
.pics button { border: 0; padding: 0; background: none; cursor: zoom-in; display: block; width: 100% }
.pics img { display: block; max-width: 100%; height: auto; image-rendering: pixelated; margin: 0 auto }

.body { padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0 }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px }

.verdict { font: 600 .8rem var(--f-data) }
.v-PASS { color: var(--ok) } .v-WARN { color: var(--warn) } .v-FAIL { color: var(--bad) }

.kv dt { color: var(--muted) } .kv dd { margin: 0 }
.note { margin: 0; font-size: .92rem; max-width: 65ch }

.findings { margin: 0; padding-left: 18px; font: .78rem/1.45 var(--f-data); color: var(--muted) }
.actions { display: flex; flex-wrap: wrap; gap: 6px }
.actions button { font: 700 .88rem var(--f-body); padding: 8px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer }

textarea { width: 100%; min-height: 54px; resize: vertical; font: .9rem var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px }
.saved { font: .75rem var(--f-data); color: var(--muted); min-height: 1em }
.links a { color: var(--accent); font-size: .85rem }

.zoom .bar button { font: 700 .9rem var(--f-body); padding: 8px 12px; border-radius: 4px; border: 0; background: #fff; color: #111; cursor: pointer }
.empty { color: var(--muted); padding: 20px; text-align: center }

@media (prefers-reduced-motion: no-preference) { .item { transition: border-color .2s } }

const SECTIONS = [
  ["family", "Families"], ["decision", "Your decision"], ["approved", "Approved art changed"], ["free", "Free fixes"], ["redraw", "Needs a redraw"], ["all", "All"]
];
const SECTION_NOTE = {
  family: "One card per family: the in-game frame first, then each piece. Approve, fix or reject each piece. Approve all when every piece is right.",
  decision: "A change across whole levels: look at the colour and greyscale frames together.",
  approved: "These were approved before. The clean pass changed them, so they need your yes again.",
  free: "Fixed by script at 0 credits: windows stamped, blotches and dirt cleaned, outlines completed. Approve to merge into round1.",
  redraw: "Not fixable by script. Redraw means a brief for you to approve before any credits are spent."
};
let decisions = {}, tab = "decision", canWrite = true, db = null;
try { const t = localStorage.getItem("fetch-review-tab"); if (t && SECTIONS.some(s => s[0] === t)) tab = t; } catch (e) {}

const $ = s => document.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
function units() { const u = []; for (const i of ITEMS) { if (i.members) u.push(...i.members); else u.push(i); } return u; }
function count(sec) { const s = sec === "all" ? ITEMS : ITEMS.filter(i => i.section === sec); return s.reduce((n, i) => n + (i.members ? i.members.length : 1), 0); }
function renderSummary() {
  const n = { approve: 0, fix: 0, redraw: 0 };
  const U = units();
  for (const i of U) { const d = decisions[i.id]; if (d && n[d.status] != null) n[d.status]++; }
  const open = U.length - n.approve - n.fix - n.redraw;
  const s = $("#summary"); s.replaceChildren(
    el("span", { class: "chip" }, el("b", { text: String(open) }), " waiting for you"),
    el("span", { class: "chip ok" }, el("b", { text: String(n.approve) }), " approved"),
    el("span", { class: "chip warn" }, el("b", { text: String(n.fix) }), " fix"),
    el("span", { class: "chip bad" }, el("b", { text: String(n.redraw) }), " reject or redraw"));
}
function renderTabs() {
  $("#tabs").replaceChildren(...SECTIONS.map(([k, label]) => el("button", {
    "aria-pressed": String(tab === k), onclick: () => { tab = k; try { localStorage.setItem("fetch-review-tab", k); } catch (e) {} ; render(); }
  }, label, el("span", { class: "n", text: count(k) }))));
}
function picture(src, cap) {
  const b = el("button", { "aria-label": "Open " + cap + " full size", onclick: () => openZoom(src) }, el("img", { src, alt: cap, loading: "lazy" }));
  return el("div", {}, b, el("div", { class: "cap", text: cap }));
}
function decisionBlock(id, title, labels) {
  const d = decisions[id] || {};
  const saved = el("div", { class: "saved", id: "s-" + id, text: d.updatedAt ? "Saved " + new Date(d.updatedAt).toLocaleString() : "" });
  const ta = el("textarea", { id: "c-" + id, placeholder: "Note for Claude (optional)", "aria-label": "Note for " + title });
  ta.value = d.comment || "";
  ta.addEventListener("change", () => save(id, { comment: ta.value }));
  const acts = el("div", { class: "actions" }, ...labels.map(([v, l]) =>
    el("button", { "data-v": v, "aria-pressed": String(d.status === v), onclick: () => save(id, { status: d.status === v ? "" : v, comment: ta.value }) }, l)));
  if (!canWrite) { acts.querySelectorAll("button").forEach(b => b.disabled = true); ta.disabled = true; }
  return [acts, ta, saved];
}
function familyRow(it) {
  const pics = el("div", { class: "pics" });
  for (const im of (it.images || [])) pics.append(picture(im.src, im.label));
  const body = el("div", { class: "body" });
  const head = el("div", { class: "head" }, el("h2", { text: it.title }));
  if (it.layer) head.append(el("span", { class: "tag", text: it.layer + " layer" }));
  if (it.group) head.append(el("span", { class: "tag", text: it.group }));
  if (it.tier) head.append(el("span", { class: "tag", text: "tier " + it.tier }));
  body.append(head);
  if (it.note) body.append(el("p", { class: "note", text: it.note }));
  if (it.question) body.append(el("p", { class: "question", text: it.question }));
  const all = el("button", { onclick: () => { for (const m of it.members) save(m.id, { status: "approve", comment: (decisions[m.id] || {}).comment || "" }); } }, "Approve all");
  if (!canWrite) all.disabled = true;
  body.append(el("div", { class: "actions" }, all));
  for (const m of it.members) {
    const d = decisions[m.id] || {};
    const row = el("div", { class: m.img ? "member" : "member nopic", "data-status": d.status || "" });
    if (m.img) row.append(el("button", { class: "mpic", "aria-label": "Open " + m.title + " full size", onclick: () => openZoom(m.img) }, el("img", { src: m.img, alt: m.title, loading: "lazy" })));
    const mb = el("div", { class: "mbody" }, el("div", { class: "head" }, el("h2", { text: m.title }), m.slot ? el("span", { class: "tag", text: m.slot }) : null));
    if (m.note) mb.append(el("p", { class: "note", text: m.note }));
    if (m.findings && m.findings.length) mb.append(el("ul", { class: "findings" }, ...m.findings.map(f => el("li", { text: f }))));
    mb.append(...decisionBlock(m.id, m.title, [["approve", "Approve"], ["fix", "Fix"], ["redraw", "Reject"]]));
    row.append(mb); body.append(row);
  }
  return el("article", { class: "item", id: "i-" + it.id }, pics, body);
}
function itemRow(it) {
  if (it.members) return familyRow(it);
  const d = decisions[it.id] || {};
  const pics = el("div", { class: "pics" });
  if (it.images) for (const im of it.images) pics.append(picture(im.src, im.label + ": before | after, colour then greyscale"));
  if (it.img) pics.append(picture(it.img, "before | after"));
  if (!it.img && !it.images && it.card) pics.append(picture(it.card, "QA card"));
  const body = el("div", { class: "body" });
  const head = el("div", { class: "head" }, el("h2", { text: it.title }));
  if (it.layer) head.append(el("span", { class: "tag", text: it.layer + " layer" }));
  if (it.group) head.append(el("span", { class: "tag", text: it.group }));
  if (it.before) head.append(el("span", { class: "verdict" }, el("span", { class: "v-" + it.before, text: it.before }), " → ", el("span", { class: "v-" + it.after, text: it.after })));
  body.append(head);
  if (it.fixed || it.left) {
    const kv = el("dl", { class: "kv" });
    if (it.fixed && it.fixed.length) kv.append(el("dt", { text: "Fixed" }), el("dd", { text: it.fixed.join(", ") + (it.px ? `  (${it.px} px changed)` : "") }));
    kv.append(el("dt", { text: "Left" }), el("dd", { text: (it.left && it.left.length) ? it.left.join(", ") : "nothing failing" }));
    body.append(kv);
  }
  if (it.note) body.append(el("p", { class: "note", text: it.note }));
  if (it.question) body.append(el("p", { class: "question", text: it.question }));
  if (it.findings && it.findings.length) body.append(el("ul", { class: "findings" }, ...it.findings.map(f => el("li", { text: f }))));
  if (it.card && it.img) body.append(el("div", { class: "links" }, el("a", { href: "#", onclick: e => { e.preventDefault(); openZoom(it.card); } , text: "Open the QA card" })));
  const saved = el("div", { class: "saved", id: "s-" + it.id, text: d.updatedAt ? "Saved " + new Date(d.updatedAt).toLocaleString() : "" });
  const ta = el("textarea", { id: "c-" + it.id, placeholder: "Note for Claude (optional)", "aria-label": "Note for " + it.title });
  ta.value = d.comment || "";
  ta.addEventListener("change", () => save(it.id, { comment: ta.value }));
  const acts = el("div", { class: "actions" }, ...[["approve", "Approve"], ["fix", "Fix"], ["redraw", "Redraw"]].map(([v, l]) =>
    el("button", { "data-v": v, "aria-pressed": String(d.status === v), onclick: () => save(it.id, { status: d.status === v ? "" : v, comment: ta.value }) }, l)));
  if (!canWrite) { acts.querySelectorAll("button").forEach(b => b.disabled = true); ta.disabled = true; }
  body.append(acts, ta, saved);
  return el("article", { class: "item", "data-status": d.status || "", id: "i-" + it.id }, pics, body);
}
function render() {
  renderTabs(); renderSummary();
  const ban = $("#banner");
  const note = SECTION_NOTE[tab];
  if (!db) { ban.hidden = false; ban.textContent = "Saving is not available in this view. You can look at everything; open the page in Claude to record your calls."; }
  else if (!canWrite) { ban.hidden = false; ban.textContent = "You can view this board but not record decisions."; }
  else if (note) { ban.hidden = false; ban.textContent = note; } else ban.hidden = true;
  const shown = ITEMS.filter(i => tab === "all" || i.section === tab);
  if (tab === "family" && !shown.length) { $("#list").replaceChildren(el("div", { class: "empty", text: "No family waiting. The next one is the River Walk sample screen." })); return; }
  $("#list").replaceChildren(...(shown.length ? shown.map(itemRow) : [el("div", { class: "empty", text: "Nothing here yet." })]));
}
async function save(id, patch) {
  if (!db || !canWrite) return;
  const cur = decisions[id] || {};
  const next = { status: patch.status ?? cur.status ?? "", comment: patch.comment ?? cur.comment ?? "", updatedAt: Date.now() };
  if (next.status === (cur.status ?? "") && next.comment === (cur.comment ?? "")) return;
  decisions[id] = next; render();
  try { await db.collection("decisions").doc(id).set(next); }
  catch (e) {
    if (e && e.code === "invalid_argument") { canWrite = false; render(); }
    else { const s = document.getElementById("s-" + id); if (s) s.textContent = "Not saved: " + (e && e.message || "try again"); }
  }
}
let zoomScale = 1;
function openZoom(src) {
  const z = $("#zoom"), img = $("#zImg"); img.src = src; zoomScale = 1;
  img.onload = () => { const fit = Math.max(1, Math.floor((window.innerWidth - 32) / img.naturalWidth)); zoomScale = Math.min(fit, 2); size(); };
  z.hidden = false; $("#zClose").focus();
}
function size() { const img = $("#zImg"); img.style.width = Math.round(img.naturalWidth * zoomScale) + "px"; }
$("#zIn").onclick = () => { zoomScale = Math.min(6, zoomScale + 0.5); size(); };
$("#zOut").onclick = () => { zoomScale = Math.max(0.25, zoomScale - 0.5); size(); };
$("#zClose").onclick = () => { $("#zoom").hidden = true; };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#zoom").hidden = true; });

render();
(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  const user = window.claude ? await window.claude.use("user") : null;
  if (user) { try { const c = await user.can("data.write"); if (c === false) canWrite = false; } catch (e) {} }
  if (!db) { render(); return; }
  db.collection("decisions").onSnapshot(snap => {
    const next = {};
    for (const d of snap.docs) if (d.exists) next[d.id] = d.data();
    decisions = next;
    const a = document.activeElement;
    if (a && a.tagName === "TEXTAREA") { renderSummary(); return; }   // don't wipe a note being typed
    render();
  }, () => { render(); });
  render();
})();
