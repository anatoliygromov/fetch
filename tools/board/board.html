:root[data-theme="dark"] {

* { box-sizing: border-box }

.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px }

.list { display: grid; gap: 14px }
.item { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); overflow: hidden }

@media (prefers-reduced-motion: no-preference) { .item { transition: border-color .2s } }

    row.append(mb); body.append(row);
  }
  return el("article", { class: "item", id: "i-" + it.id }, pics, body);
}
function itemRow(it) {
  if (it.members) return familyRow(it);
  const d = decisions[it.id] || {};
  const pics = el("div", { class: "pics" });
  if (it.images) for (const im of it.images) pics.append(picture(im.src, im.label + ": before | after, colour then greyscale"));
  if (it.img) pics.append(picture(it.img, "before | after"));
  if (!it.img && !it.images && it.card) pics.append(picture(it.card, "QA card"));
  const body = el("div", { class: "body" });
  const head = el("div", { class: "head" }, el("h2", { text: it.title }));
  if (it.layer) head.append(el("span", { class: "tag", text: it.layer + " layer" }));
  if (it.group) head.append(el("span", { class: "tag", text: it.group }));
  if (it.before) head.append(el("span", { class: "verdict" }, el("span", { class: "v-" + it.before, text: it.before }), " → ", el("span", { class: "v-" + it.after, text: it.after })));
  body.append(head);
  if (it.fixed || it.left) {
    const kv = el("dl", { class: "kv" });
    if (it.fixed && it.fixed.length) kv.append(el("dt", { text: "Fixed" }), el("dd", { text: it.fixed.join(", ") + (it.px ? `  (${it.px} px changed)` : "") }));
    kv.append(el("dt", { text: "Left" }), el("dd", { text: (it.left && it.left.length) ? it.left.join(", ") : "nothing failing" }));
    body.append(kv);
  }
  if (it.note) body.append(el("p", { class: "note", text: it.note }));
  if (it.question) body.append(el("p", { class: "question", text: it.question }));
  if (it.findings && it.findings.length) body.append(el("ul", { class: "findings" }, ...it.findings.map(f => el("li", { text: f }))));
  if (it.card && it.img) body.append(el("div", { class: "links" }, el("a", { href: "#", onclick: e => { e.preventDefault(); openZoom(it.card); } , text: "Open the QA card" })));
  const saved = el("div", { class: "saved", id: "s-" + it.id, text: d.updatedAt ? "Saved " + new Date(d.updatedAt).toLocaleString() : "" });
  const ta = el("textarea", { id: "c-" + it.id, placeholder: "Note for Claude (optional)", "aria-label": "Note for " + it.title });
  ta.value = d.comment || "";
  ta.addEventListener("change", () => save(it.id, { comment: ta.value }));
  const acts = el("div", { class: "actions" }, ...[["approve", "Approve"], ["fix", "Fix"], ["redraw", "Redraw"]].map(([v, l]) =>
    el("button", { "data-v": v, "aria-pressed": String(d.status === v), onclick: () => save(it.id, { status: d.status === v ? "" : v, comment: ta.value }) }, l)));
  if (!canWrite) { acts.querySelectorAll("button").forEach(b => b.disabled = true); ta.disabled = true; }
  body.append(acts, ta, saved);
  return el("article", { class: "item", "data-status": d.status || "", id: "i-" + it.id }, pics, body);
}
function render() {
  renderTabs(); renderSummary();
  const ban = $("#banner");
  const note = SECTION_NOTE[tab];
  if (!db) { ban.hidden = false; ban.textContent = "Saving is not available in this view. You can look at everything; open the page in Claude to record your calls."; }
  else if (!canWrite) { ban.hidden = false; ban.textContent = "You can view this board but not record decisions."; }
  else if (note) { ban.hidden = false; ban.textContent = note; } else ban.hidden = true;
  const shown = ITEMS.filter(i => tab === "all" || i.section === tab);
  if (tab === "family" && !shown.length) { $("#list").replaceChildren(el("div", { class: "empty", text: "No family waiting." })); return; }
  $("#list").replaceChildren(...(shown.length ? shown.map(itemRow) : [el("div", { class: "empty", text: "Nothing here yet." })]));
}
async function save(id, patch) {
  if (!db || !canWrite) return;
  const cur = decisions[id] || {};
  const next = { status: patch.status ?? cur.status ?? "", comment: patch.comment ?? cur.comment ?? "", updatedAt: Date.now() };
  if (next.status === (cur.status ?? "") && next.comment === (cur.comment ?? "")) return;
  decisions[id] = next; render();
  try { await db.collection("decisions").doc(id).set(next); }
  catch (e) {
    if (e && e.code === "invalid_argument") { canWrite = false; render(); }
    else { const s = document.getElementById("s-" + id); if (s) s.textContent = "Not saved: " + (e && e.message || "try again"); }
  }
}
let zoomScale = 1;
function openZoom(src) {
  const z = $("#zoom"), img = $("#zImg"); img.src = src; zoomScale = 1;
  img.onload = () => { const fit = Math.max(1, Math.floor((window.innerWidth - 32) / img.naturalWidth)); zoomScale = Math.min(fit, 2); size(); };
  z.hidden = false; $("#zClose").focus();
}
function size() { const img = $("#zImg"); img.style.width = Math.round(img.naturalWidth * zoomScale) + "px"; }
$("#zIn").onclick = () => { zoomScale = Math.min(6, zoomScale + 0.5); size(); };
$("#zOut").onclick = () => { zoomScale = Math.max(0.25, zoomScale - 0.5); size(); };
$("#zClose").onclick = () => { $("#zoom").hidden = true; };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#zoom").hidden = true; });

render();
(async () => {
  db = window.claude ? await window.claude.use("db") : null;
  const user = window.claude ? await window.claude.use("user") : null;
  if (user) { try { const c = await user.can("data.write"); if (c === false) canWrite = false; } catch (e) {} }
  if (!db) { render(); return; }
  db.collection("decisions").onSnapshot(snap => {
    const next = {};
    for (const d of snap.docs) if (d.exists) next[d.id] = d.data();
    decisions = next;
    const a = document.activeElement;
    if (a && a.tagName === "TEXTAREA") { renderSummary(); return; }   // don't wipe a note being typed
    render();
  }, () => { render(); });
  render();
})();
</script>
